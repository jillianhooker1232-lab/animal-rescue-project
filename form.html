<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>
<body style="text-align: center; background-color: rgb(37, 218, 171)">
    <a href="../index.html" title="Home">
        <img src="../images/logo.png" 
            alt="Twin Cities Animal Rescue Logo" style = "color: white; width: 200px; height: 200px;"> 
    </a>
        <br>
    <hr style ="border: 1px solid white; width: 100%;">
    <form>
        <fieldset>
            <legend>Contact Information</legend>
            <label style="color: white;">First Name:</label>
            <input type="text" placeholder="John" required>
            <div>
            <label style="color: white;">Last Name:</label>
            <input type="text" placeholder="Doe" required>
            </div>
            <div>
            <label style="color: white;">Email:</label>
            <input type="email" placeholder="john.doe@example.com" required>
            </div>
            <div>
            <label style="color: white;">Interest Type:</label>
            <select>
                <option value="adoption">Adoption</option>
                <option value="foster">Foster</option>
                <option value="volunteer">Volunteer</option>
            </select>
            </div>
        </fieldset>
        <p style="color: white;">Only fill out the availability section if you selected volunteer.</p>
        <hr style ="border: 1px solid white; width: 100%;">
        <label style="color:white">Availability:</label>
        <br>
        <div>
        <label style="color:white">Sunday</label> 
        <input type="checkbox">
        </div>
        <div>
        <label style="color:white">Monday</label> 
        <input type="checkbox">
        </div>
        <div>
        <label style="color:white">Tuesday</label> 
        <input type="checkbox">
        </div>
                <div>
        <label style="color:white">Wednesday</label> 
        <input type="checkbox">
        </div>
                <div>
        <label style="color:white">Thursday</label> 
        <input type="checkbox">
        </div>
                <div>
        <label style="color:white">Friday</label> 
        <input type="checkbox">
        </div>
                <div>
        <label style="color:white">Saturday</label> 
        <input type="checkbox">
        </div>
        <hr style ="border: 1px solid white; width: 100%;">
        <br>
        <label style="color:white">Do you have experience with pets? (This does not determine eligibility)</label> <input type="checkbox">
        <br>
        <br>
        <div>
        <label style="color:white">Please describe your experiences or anything else you would like us to know.</label>
        </div>
        <br>
        <div>
        <textarea rows="6" cols="50"></textarea>
        </div>
        <br>
        <div>
        <input type="submit">
        </div>
        <br>
        <div>
        <input type="reset">
        </div>
    </form>
    <hr style ="border: 1px solid white; width: 100%;">
    <h1 style="color:white">-Navigation-</h1>
    <table align="center">
        <tr>
            <td>
                <figue> 
                    <a href="../index.html" title="Home">
                    <img src="../images/home.png" style="width:200px">
                    </a>
                    <figcaption style="color:white">Home</figcaption>
                </figue>
            </td>
            <td>
                <figure>
                    <a href="services.html" title="Services">
                    <img src="../images/services.png" style="width:200px">
                    </a>
                    <div>
                        <figurecaption style="color:white">Services</figurecaption>
                    </div>
                </figure>
            </td>
            <td>
                <figure>
                    <a href="about.html" title="About">
                    <img src="../images/about.png" style="width:200px">
                    </a>
                    <div>
                        <figurecaption style="color:white">About</figurecaption>
                    </div>
                </figure>
            </td>
            <td>
                <figure>
                    <a href="contact.html" title="Contact">
                    <img src="../images/contact.png" style="width:200px">
                    </a>
                    <div>
                        <figurecaption style="color:white">Contact</figurecaption>
                    </div>
                </figure>
            </td>
        </tr>
    </table>
    <br>
    <br>
</body>
</html>
